<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Product listing demo with category filters and sorting."><title>Forma Store | Task 4</title><link rel="stylesheet" href="style.css"></head>
<body><header><nav class="wrap nav"><a class="logo" href="#">forma<span>.</span></a><span class="nav-caption">Thoughtful everyday essentials</span></nav></header>
<main class="wrap"><section class="hero"><p class="eyebrow">THE EVERYDAY EDIT</p><h1>Find your next<br><span>favorite thing.</span></h1><p>Browse a small sample collection. Filter by category or price and sort the products to find what you want.</p></section>
<section class="toolbar"><div class="filters"><label for="categoryFilter">Category</label><select id="categoryFilter"><option value="all">All categories</option><option value="Tech">Tech</option><option value="Home">Home</option><option value="Accessories">Accessories</option></select><label for="maxPrice">Maximum price</label><select id="maxPrice"><option value="all">Any price</option><option value="500">Up to ₹500</option><option value="1000">Up to ₹1,000</option><option value="2000">Up to ₹2,000</option></select></div><div class="sort"><label for="sortBy">Sort by</label><select id="sortBy"><option value="featured">Featured</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="rating">Highest rating</option></select></div></section>
<p class="result-count" id="resultCount" aria-live="polite"></p><section class="products" id="productGrid" aria-label="Product results"></section></main><footer>Forma Store · Sample product listing for ApexPlanet Task 4</footer><script src="script.js"></script></body></html>
